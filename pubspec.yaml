name: orbix
description: "Orbix — cinematic IPTV player"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  animations: ^3.0.0
  cached_network_image: ^4.0.4
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  dio: ^5.11.1
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^18.0.2
  intl: ^0.20.3
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  speech_to_text: ^7.5.0
  url_launcher: ^6.3.3
  xml: ^7.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  drift_dev: ^2.35.1
  vector_graphics_compiler: ^1.3.0
  shared_preferences_platform_interface: ^2.4.2


flutter:
  uses-material-design: true
  generate: true # gen-l10n (see l10n.yaml)

  assets:
    # Demo artwork from the design handoff — used by the dev gallery only.
    # TODO(release): drop from release builds once real playlists drive all art.
    - assets/demo/

  # Static instances (one file per weight) — Flutter does not reliably map
  # FontWeight onto a variable font's wght axis.
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/unbounded/Unbounded-400.ttf
          weight: 400
        - asset: assets/fonts/unbounded/Unbounded-500.ttf
          weight: 500
        - asset: assets/fonts/unbounded/Unbounded-600.ttf
          weight: 600
        - asset: assets/fonts/unbounded/Unbounded-700.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/manrope/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/manrope/Manrope-800.ttf
          weight: 800
    - family: Readex Pro
      fonts:
        - asset: assets/fonts/readex_pro/ReadexPro-300.ttf
          weight: 300
        - asset: assets/fonts/readex_pro/ReadexPro-400.ttf
          weight: 400
        - asset: assets/fonts/readex_pro/ReadexPro-500.ttf
          weight: 500
        - asset: assets/fonts/readex_pro/ReadexPro-600.ttf
          weight: 600
        - asset: assets/fonts/readex_pro/ReadexPro-700.ttf
          weight: 700
