<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbix — PIN unlock</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../orbix.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;family=Readex+Pro:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
.key{height:66px;border-radius:22px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-family:'Unbounded',sans-serif;font-weight:500;font-size:24px;color:#F5F1EB;display:flex;align-items:center;justify-content:center}
.key:active{background:rgba(255,122,61,.2)}
</style>
</helmet>
<div class="ox" style="width: 412px; height: 915px; background: #050507">
  <img class="fill-img" src="../assets/b-neon.jpg" alt="" style="filter: blur(28px) brightness(.35) saturate(1.2); transform: scale(1.2)">
  <div style="position: absolute; inset: 0; background: radial-gradient(80% 50% at 50% 30%, rgba(255,122,61,.12), rgba(5,5,7,.6) 70%)"></div>

  <div style="position: absolute; top: 40px; left: 10px; right: 10px; display: flex; justify-content: space-between">
    <a href="LiveTV.dc.html" class="ibtn" aria-label="Close"><span class="ic i-close"></span></a>
  </div>

  <div style="position: absolute; top: 120px; left: 24px; right: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
    <div style="position: relative; width: 84px; height: 84px">
      <div style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255,122,61,.5); animation: ox-ring 2s infinite"></div>
      <div style="position: absolute; inset: 0; border-radius: 50%; background: rgba(255,122,61,.14); border: 1.5px solid #FF7A3D; color: #FF7A3D; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(255,122,61,.35)"><span class="ic ic-xl i-lock"></span></div>
    </div>
    <h1 class="t-h1" style="font-size: 24px; margin-top: 6px">Enter PIN</h1>
    <div class="glass-lite" style="display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 6px; border-radius: 999px">
      <span class="chlogo" style="width: 24px; height: 24px; font-size: 8px; border-radius: 7px; background: linear-gradient(145deg,#5A5A6E,#1E1E28)">LN</span>
      <span style="font-weight: 700; font-size: 13px">Late Night Cinema is locked</span>
    </div>
  </div>

  <div style="position: absolute; top: 368px; left: 0; right: 0; display: flex; justify-content: center; gap: 22px" aria-label="2 of 4 digits entered">
    <span style="width: 16px; height: 16px; border-radius: 50%; background: #FF7A3D; box-shadow: 0 0 12px rgba(255,122,61,.8)"></span>
    <span style="width: 16px; height: 16px; border-radius: 50%; background: #FF7A3D; box-shadow: 0 0 12px rgba(255,122,61,.8)"></span>
    <span style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid #F5F1EB; animation: ox-pulse 1.2s infinite"></span>
    <span style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3)"></span>
  </div>

  <div style="position: absolute; left: 36px; right: 36px; top: 440px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 18px">
    <button class="key">1</button><button class="key">2</button><button class="key">3</button>
    <button class="key">4</button><button class="key">5</button><button class="key">6</button>
    <button class="key">7</button><button class="key">8</button><button class="key">9</button>
    <span></span><button class="key">0</button><button class="key" aria-label="Delete" style="background: transparent; border-color: transparent"><span class="ic ic-lg i-backspace flip"></span></button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 48px; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <button class="btn btn-ghost btn-sm" style="color: #FF9663">Forgot PIN?</button>
    <span class="t-cap">Reset it with your IPTV account password</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
