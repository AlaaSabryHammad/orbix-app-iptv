<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbix — Search results</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../orbix.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;family=Readex+Pro:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div class="ox" style="width: 412px; height: 915px; background: #08080B">
  <div style="padding: 40px 16px 0 8px; display: flex; align-items: center; gap: 6px">
    <a href="Search.dc.html" class="ibtn" aria-label="Back"><span class="ic i-back flip"></span></a>
    <div class="search input focus" style="flex: 1; border-radius: 999px; height: 50px">
      <span class="ic ic-sm i-search" style="color: #F5F1EB"></span>
      <label for="q2" class="hide">Search</label>
      <input id="q2" value="nor">
      <button class="ibtn ibtn-round" aria-label="Clear" style="width: 34px; height: 34px; color: #B4B0BA"><span class="ic ic-sm i-close"></span></button>
      <a href="SearchVoice.dc.html" class="ibtn ibtn-round" aria-label="Voice search" style="width: 38px; height: 38px; background: rgba(255,122,61,.16); color: #FF7A3D"><span class="ic ic-md i-mic"></span></a>
    </div>
  </div>

  <div class="scroll-x" style="gap: 8px; padding: 14px 20px 0">
    <button class="chip on">All · 14</button>
    <button class="chip">Movies · 5</button>
    <button class="chip">Series · 3</button>
    <button class="chip">Channels · 6</button>
    <button class="chip ember">2026 <span class="ic ic-xs i-close"></span></button>
  </div>

  <section style="margin: 14px 12px 0; padding: 6px; border-radius: 20px; background: #101015; border: 1px solid rgba(255,255,255,.08)">
    <sc-for list="{{sugg}}" as="s" hint-placeholder-count="3">
      <a href="{{s.href}}" style="display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 10px; border-radius: 14px; text-decoration: none">
        <span style="width: 32px; height: 32px; border-radius: 10px; background: #20202A; display: flex; align-items: center; justify-content: center; color: #B4B0BA"><span class="ic ic-sm {{s.icon}}"></span></span>
        <span style="flex: 1; min-width: 0; font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><b style="color: #FF9663; font-weight: 800">{{s.hit}}</b>{{s.rest}}</span>
        <span class="t-cap">{{s.type}}</span>
        <span class="ic ic-sm i-chev-u" style="color: #8E8A97; transform: rotate(-45deg)"></span>
      </a>
    </sc-for>
  </section>

  <section style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 10px">
    <h2 class="t-over">Channels</h2>
    <sc-for list="{{channels}}" as="c" hint-placeholder-count="2">
      <a href="PlayerLive.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none">
        <div class="chlogo" style="width: 44px; height: 44px; font-size: 11px; background: {{c.bg}}">{{c.logo}}</div>
        <div style="flex: 1; min-width: 0">
          <div style="display: flex; align-items: center; gap: 6px"><span class="t-title" style="font-size: 14px"><b style="color: #FF9663">{{c.hit}}</b>{{c.rest}}</span><span class="badge {{c.qc}}">{{c.q}}</span></div>
          <div class="t-cap" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.now}}</div>
        </div>
        <span class="badge b-live">LIVE</span>
      </a>
    </sc-for>
  </section>

  <section style="padding: 22px 0 0">
    <h2 class="t-over" style="padding: 0 20px; margin-bottom: 10px">Movies &amp; series</h2>
    <div class="rail" style="gap: 10px">
      <sc-for list="{{titles}}" as="m" hint-placeholder-count="4">
        <a href="{{m.href}}" style="width: 104px; flex: none; display: flex; flex-direction: column; gap: 6px; text-decoration: none">
          <div class="poster" style="width: 104px; border-radius: 12px">
            <img src="{{m.img}}" alt="">
            <div class="tl"><span class="badge b-soft" style="background: rgba(0,0,0,.6); color: #F5F1EB">{{m.kind}}</span></div>
          </div>
          <span style="font-weight: 700; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.title}}</span>
        </a>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    const B = (id) => '../assets/' + id;
    return {
      sugg: [
        { href: 'MovieDetails.dc.html', icon: 'i-film', hit: 'Nor', rest: 'thbound', type: 'Movie · 2026' },
        { href: 'PlayerLive.dc.html', icon: 'i-live', hit: 'Nor', rest: 'thern United — live match', type: 'Live now' },
        { href: 'SearchResults.dc.html', icon: 'i-search', hit: 'Nor', rest: 'dic crime', type: 'Genre' }
      ],
      channels: [
        { logo: 'N+', bg: 'linear-gradient(145deg,#4FD1C5,#0F4C4A)', hit: 'Nor', rest: 'th+ Nature', q: '4K', qc: 'b-4k', now: 'Northbound: An Arctic Year · 20:00–21:00' },
        { logo: 'P1', bg: 'linear-gradient(145deg,#2FBF71,#0E4A2B)', hit: '', rest: 'Pulse Sports 1', q: 'FHD', qc: 'b-fhd', now: 'Coastal FC vs Northern United · 20:30–22:30' }
      ],
      titles: [
        { href: 'MovieDetails.dc.html', img: B('p-northbound.jpg'), title: 'Northbound', kind: 'MOVIE' },
        { href: 'SeriesDetails.dc.html', img: B('p-frost.jpg'), title: 'The Frost Line', kind: 'SERIES' },
        { href: 'MovieDetails.dc.html', img: B('p-halcyon.jpg'), title: 'Halcyon Drift', kind: 'MOVIE' },
        { href: 'SeriesDetails.dc.html', img: B('p-lighthouse.jpg'), title: 'The Keepers', kind: 'SERIES' }
      ]
    };
  }
}
</script>
</body>
</html>
