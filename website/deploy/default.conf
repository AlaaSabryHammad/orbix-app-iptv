server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Headers are repeated per location: nginx drops server-level add_header
    # in any location that sets its own.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'";

    location / {
        try_files $uri $uri/ =404;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }

    # The APK: right MIME type, always a download, never cached stale.
    location /download/ {
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=300";
    }
}
